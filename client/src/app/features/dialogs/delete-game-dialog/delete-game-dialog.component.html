<app-modal [title]="(isGame() ? 'deleteGame.titleGame' : 'deleteGame.titleImage') | translate" (closed)="close()">
  <p class="mb-3">{{ (isGame() ? 'deleteGame.descriptionGame' : 'deleteGame.descriptionImage') | translate }}</p>
  <dl class="space-y-2 rounded-md bg-shell-100 p-3 dark:bg-shell-950">
    <div><dt class="muted text-xs">{{ 'deleteGame.name' | translate }}</dt><dd class="font-medium">{{ name() }}</dd></div>
    <div><dt class="muted text-xs">{{ 'deleteGame.path' | translate }}</dt><dd class="break-all font-mono text-xs">{{ target() }}</dd></div>
  </dl>
  @if (isGame()) {
    <label class="mt-3 flex items-start gap-2 {{ csvReady() ? '' : 'opacity-50' }}">
      <input type="checkbox" class="mt-0.5" [checked]="alsoCsv()" [disabled]="!csvReady()" (change)="alsoCsv.set(checkedOf($event))" />
      <span>{{ 'deleteGame.alsoCsv' | translate }}@if (!csvReady()) { {{ 'deleteGame.csvNotConfigured' | translate }} }</span>
    </label>
  }
  <div footer class="contents">
    <button type="button" class="btn" (click)="cancelled.emit()" [disabled]="busy()">{{ 'buttons.cancel' | translate }}</button>
    <button type="button" class="btn btn-primary" [disabled]="busy()" (click)="confirmed.emit(alsoCsv())">
      <app-icon [name]="busy() ? 'loader' : 'trash'" [size]="15" [class.animate-spin]="busy()" /> {{ 'buttons.delete' | translate }}
    </button>
  </div>
</app-modal>
