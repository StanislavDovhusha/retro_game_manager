<div class="relative w-64 max-w-full">
  <app-icon name="search" [size]="14" class="muted absolute left-2.5 top-1/2 -translate-y-1/2" />
  <input class="input pl-8 pr-8" [placeholder]="'csvEditor.filterPlaceholder' | translate" [value]="filter()" (input)="filterChange.emit(valueOf($event))" />
  @if (filter()) {
    <button type="button" class="muted absolute right-2 top-1/2 -translate-y-1/2" (click)="filterChange.emit('')" [attr.aria-label]="'buttons.clear' | translate"><app-icon name="x" [size]="14" /></button>
  }
</div>
<button type="button" class="btn" (click)="addRow.emit()"><app-icon name="plus" [size]="15" /> {{ 'csvEditor.addRow' | translate }}</button>
<button type="button" class="btn" (click)="removeDuplicates.emit()" [disabled]="duplicateCount() === 0"
  [title]="'csvEditor.duplicatesHint' | translate: { column: keyName() }">
  <app-icon name="copy-minus" [size]="15" />
  {{ duplicateCount() > 0 ? ('csvEditor.removeDuplicatesCount' | translate: { count: duplicateCount() }) : ('csvEditor.removeDuplicates' | translate) }}
</button>
<button type="button" class="btn" (click)="removeMissing.emit()" [disabled]="dirty() || checking() || removing()"
  [title]="(dirty() ? 'csvEditor.removeMissingDirty' : 'csvEditor.removeMissingHint') | translate">
  <app-icon [name]="checking() ? 'loader' : 'file-x'" [size]="15" [class.animate-spin]="checking()" /> {{ 'csvEditor.removeMissing' | translate }}
</button>
<span class="muted ml-auto text-xs">
  @if (filter().trim()) {
    {{ 'csvEditor.summaryFiltered' | translate: { count: rowCount(), shown: shownCount(), column: keyName() } }}
  } @else {
    {{ 'csvEditor.summary' | translate: { count: rowCount(), column: keyName() } }}
  }
</span>
