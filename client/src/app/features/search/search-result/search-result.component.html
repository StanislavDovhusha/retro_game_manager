<span class="flex min-w-0 items-baseline gap-2">
  <span class="min-w-0 flex-1 truncate"><app-highlight [text]="game().title" [query]="term()" /></span>
  @if (alsoMatched(); as also) { <span class="muted max-w-[45%] shrink-0 truncate font-mono text-[11px]"><app-highlight [text]="also" [query]="term()" /></span> }
</span>
<span class="flex min-w-0 items-center gap-1.5 text-[11px]">
  <span class="badge shrink-0 font-semibold">{{ game().folder }}</span>
  @if (fullName(); as name) { <span class="muted min-w-0 truncate">{{ name }}</span> }
  @if (game().tags.length) {
    <span class="ml-auto flex min-w-0 shrink items-center gap-1 overflow-hidden">
      @for (tag of game().tags; track tag) { <span class="badge shrink-0"><app-highlight [text]="tag" [query]="term()" /></span> }
    </span>
  }
</span>
