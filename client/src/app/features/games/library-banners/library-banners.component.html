@if (folderProblem(); as problem) {
  <div class="flex items-center gap-2 border-b border-red-500/40 bg-red-500/10 px-3 py-2 text-red-700 dark:text-red-300">
    <app-icon name="alert" [size]="15" /> {{ problem }}: <span class="font-mono text-xs">{{ gamesDir() }}</span>
  </div>
}
@if (libraryError(); as error) {
  <div class="border-b border-red-500/40 bg-red-500/10 px-3 py-2 text-red-700 dark:text-red-300">{{ error }}</div>
}
@if (hasCsvProblem()) {
  <div class="flex items-center gap-2 border-b border-amber-500/40 bg-amber-500/10 px-3 py-2 text-amber-700 dark:text-amber-300">
    <app-icon name="alert" [size]="15" /> {{ 'main.csvProblem' | translate: { error: csvError() } }}
  </div>
}
@if (readErrorCount() > 0) {
  <div class="border-b border-amber-500/40 bg-amber-500/10 px-3 py-2 text-amber-700 dark:text-amber-300">
    {{ 'main.readErrors' | translate: { count: readErrorCount() } }}
  </div>
}
